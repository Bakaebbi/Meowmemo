<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Meowmemo</title>
    </head>
    <body>
        <main>
            <h1>Meowmemo</h1>
            <p>Каждый день немного заботы для Вашего питомца</p>

            <section class="cat-profile" aria-labelledby="cat-profile-title">
                <h2 id="cat-profile-title">Мой котик</h2>
                <div class="cat-avatar-controls">
                    <button id="choose-cat-avatar" class="cat-avatar" type="button" aria-label="Добавить фото котика" title="Добавить фото котика">
                        <span id="cat-avatar-placeholder" aria-hidden="true">Добавить фото</span>
                        <img id="cat-avatar-image" alt="Аватар котика" width="96" height="96" hidden>
                    </button>
                    <input id="cat-avatar-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
                </div>
                <p id="cat-avatar-status" role="status"></p>
                <div class="cat-profile-row">
                    <p id="cat-name-display">Имя: <span id="cat-name">Шифу</span></p>
                    <button id="edit-cat-name" type="button" aria-expanded="false" aria-controls="cat-name-form">Изменить имя</button>
                    <form id="cat-name-form" hidden>
                        <label for="cat-name-input">Имя котика</label>
                        <input id="cat-name-input" name="catName" type="text" maxlength="40" required>
                        <button type="submit">Готово</button>
                        <button id="cancel-cat-name" type="button">Отмена</button>
                    </form>
                </div>
                <p id="cat-name-status" role="status"></p>
            </section>

            <section class="daily-tasks" aria-labelledby="daily-tasks-title">
                <div class="tasks-header">
                    <h2 id="daily-tasks-title">Забота сегодня</h2>
                    <button id="toggle-add-task" type="button" aria-expanded="false" aria-controls="add-task-form">Добавить задачу</button>
                </div>
                <p id="tasks-progress">Выполнено 0 из 5</p>

                <form id="add-task-form" class="add-task-form" hidden>
                    <label for="new-task-title">Новая задача</label>
                    <input id="new-task-title" name="title" type="text" maxlength="80" required>
                    <button type="submit">Добавить</button>
                    <button id="cancel-add-task" type="button">Отмена</button>
                </form>
                <ul class="task-list"></ul>
                <p id="tasks-status" role="status"></p>
            </section>

            <section class="daily-note" aria-labelledby="daily-note-title">
                <h2 id="daily-note-title">Заметка на день</h2>
                <label id="daily-note-label" for="daily-note-input">Как сегодня чувствует себя Шифу?</label>
                <textarea
                    id="daily-note-input"
                    rows="4"
                    maxlength="500"
                    aria-describedby="daily-note-hint"
                ></textarea>
                <p id="daily-note-hint">До 500 символов</p>
                <p id="daily-note-status" role="status"></p>
            </section>
            <section class="history" aria-labelledby="history-title">
                <h2 id="history-title">Последние семь дней</h2>
                <p id="history-empty" hidden>История пока пуста. Отметь задачу или добавь заметку.</p>
                <ol id="history-list" class="history-list"></ol>
            </section>
        </main>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
